<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 80px; }
        .box { background: #fff; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #3498db; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2>Chat xonasiga kirish</h2>
    <input id="room" type="text" placeholder="Xona nomi, masalan: python">
    <button id="enter">Kirish</button>
</div>
<script>
    document.getElementById('enter').onclick = function () {
        const room = document.getElementById('room').value.trim();
        if (room) {
            window.location.href = '/chat/' + encodeURIComponent(room) + '/';
        }
    };
</script>
</body>
</html>
