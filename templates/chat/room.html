<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ room_name }} - Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f5f7; max-width: 600px; margin: 30px auto; }
        #log { background: #fff; height: 400px; overflow-y: auto; padding: 15px; border-radius: 8px; }
        .msg { margin-bottom: 8px; }
        .msg b { color: #3498db; }
        .row { display: flex; gap: 8px; margin-top: 10px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 20px; background: #3498db; color: #fff; border: none; border-radius: 5px; }
        #status { color: #888; font-size: 14px; }
    </style>
</head>
<body>
<h2>Xona: {{ room_name }}</h2>
<p id="status">Ulanmoqda...</p>
<div id="log"></div>
<div class="row">
    <input id="username" type="text" placeholder="Ismingiz" style="flex: 0 0 150px">
    <input id="message" type="text" placeholder="Xabar yozing...">
    <button id="send">Yuborish</button>
</div>
{{ room_name|json_script:"room-name" }}
<script>
    const roomName = JSON.parse(document.getElementById('room-name').textContent);
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const socket = new WebSocket(protocol + window.location.host + '/ws/chat/' + roomName + '/');
    const log = document.getElementById('log');
    const status = document.getElementById('status');

    socket.onopen = function () {
        status.textContent = 'Ulandi';
    };

    socket.onclose = function () {
        status.textContent = 'Aloqa uzildi';
    };

    socket.onmessage = function (event) {
        const data = JSON.parse(event.data);
        const div = document.createElement('div');
        div.className = 'msg';
        const name = document.createElement('b');
        name.textContent = data.username + ': ';
        div.appendChild(name);
        div.appendChild(document.createTextNode(data.message));
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    };

    function sendMessage() {
        const input = document.getElementById('message');
        const username = document.getElementById('username').value;
        if (input.value.trim()) {
            socket.send(JSON.stringify({message: input.value, username: username}));
            input.value = '';
        }
    }

    document.getElementById('send').onclick = sendMessage;
    document.getElementById('message').onkeyup = function (event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    };
</script>
</body>
</html>
